# RateScout / OrderInbox — Private (on-prem) deployment with a Strata local model
#
# This is "Mode B — Private Deployment" (proposal Section 14): everything runs
# in the customer's infrastructure, and no commercial data leaves the network.
#
#   strata          the main local LLM: Strata (github.com/Niko1221/Strata)
#                   serving Qwen3.8-Flash-Next, a 125B mixture-of-experts
#                   model, on one NVIDIA card with 12 GB+ VRAM and 32-64 GB RAM
#   model-verifier  optional second, independent model (producer/verifier
#                   check, Section 11) for a second GPU / DGX Spark
#
#   docker compose -f docker-compose.strata.yml up                       # Strata only
#   docker compose -f docker-compose.strata.yml --profile verifier up    # + verifier
#
# First start: the image build compiles the Strata engine (~20-40 min), then
# the container downloads the model (~70 GB) into the strata-data volume and
# loads it (1-3 min; the host can be sluggish meanwhile). The app is up at once
# and starts using Strata as soon as its /health answers — it re-checks every
# 30 s, so nothing needs a restart. Later starts skip the build and download.
#
# Already running Strata on the host (./setup.sh)? Skip this file; use the
# normal stack with STRATA_URL=http://host.docker.internal:8080/v1.
services:
  orderinbox:
    build: .
    image: ratescout-ai:local
    ports:
      - "8501:8501"
    environment:
      - STRATA_URL=http://strata:8080/v1
      - STRATA_MODEL=strata
      - STRATA_API_KEY=${STRATA_API_KEY:-}
      # none | low | medium | high — thinking per request (Strata default: high)
      - STRATA_REASONING_EFFORT=${STRATA_REASONING_EFFORT:-low}
      # used only with --profile verifier; unreachable otherwise (ignored)
      - VLLM_URL=http://model-verifier:8000/v1
      - VLLM_MODEL=verifier-model
      # local-first; cloud stays off unless LLM_CLOUD_* / ANTHROPIC_* are set
      - LLM_MODE=auto
      - OLLAMA_URL=
      - ODOO_MODE=${ODOO_MODE:-mock}
      - WEB_PASSWORD=${WEB_PASSWORD:-ratescout}
      - ORDERINBOX_API_TOKEN=${ORDERINBOX_API_TOKEN:-private-bridge-token}
    depends_on:
      # started, not healthy: the first model download outlasts any sane
      # healthcheck window, and the app polls Strata's /health itself
      strata:
        condition: service_started
    volumes:
      - rs-data:/data
    restart: unless-stopped

  # Main local model — Strata. OpenAI-compatible API on :8080/v1, plus the
  # Strata app (chat + live GPU/RAM monitor) at http://127.0.0.1:8080.
  strata:
    build:
      context: https://github.com/Niko1221/Strata.git#v0.1.38
      args:
        # RTX 20/30/40/50 + A-series; narrow to your card for a faster build
        # (e.g. 89 = RTX 40, 120 = RTX 50)
        CUDA_ARCHITECTURES: ${STRATA_CUDA_ARCHITECTURES:-75;80;86;89;120}
        BUILD_VISION: ${STRATA_BUILD_VISION:-1}
    image: strata:v0.1.38
    environment:
      # Q2_0 | IQ2_XS | IQ3_XXS | IQ3_S — IQ2_XS fits 48-64 GB RAM
      - MODEL=${STRATA_SIZE:-IQ2_XS}
      # qwen | swift | coder
      - FAMILY=${STRATA_FAMILY:-qwen}
      - CONTEXT=${STRATA_CONTEXT:-32768}
      # yes = read scanned / image quotes (the app detects it from /health)
      - VISION=${STRATA_VISION_MODE:-no}
      - API_KEY=${STRATA_API_KEY:-}
      # the app reaches Strata as http://strata:8080; without an API key,
      # Strata's DNS-rebinding guard answers 403 to any Host it doesn't know
      - STRATA_ALLOWED_HOSTS=strata
      # set LOW_RAM=on if the container has a memory limit
      - LOW_RAM=${STRATA_LOW_RAM:-auto}
    # the monitor/chat UI, on this host only; STRATA_PORT if 8080 is taken
    ports:
      - "127.0.0.1:${STRATA_PORT:-8080}:8080"
    ulimits:
      memlock: -1
    volumes:
      - strata-data:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # which cards Strata may see: all, or an index / UUID from
              # nvidia-smi ("2", "0,2") to keep it off cards other jobs use
              device_ids: ["${STRATA_GPUS:-all}"]
              capabilities: [gpu]
    restart: unless-stopped

  # Second local model — the independent producer/verifier pass (Section 11)
  # on a second GPU or DGX Spark. Opt-in: --profile verifier.
  model-verifier:
    profiles: ["verifier"]
    image: ghcr.io/vllm/vllm-openai:latest
    command:
      - --model
      - Qwen/Qwen2.5-32B-Instruct    # <-- the verifier model
      - --served-model-name
      - verifier-model
      - --port
      - "8000"
    volumes:
      - model-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  rs-data:
  strata-data:
  model-cache:
