<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}OrderInbox AI{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">OI</div>
        <div>
          <div class="brand-name">OrderInbox AI</div>
          <div class="brand-sub">for Odoo · {{ backend if backend is defined else '' }}</div>
        </div>
      </div>
      <nav>
        <a href="/" class="{{ 'active' if request.url.path == '/' else '' }}">Dashboard</a>
        <a href="/orders" class="{{ 'active' if request.url.path.startswith('/orders') else '' }}">Orders</a>
        <a href="/inbox">Inbox</a>
        <a href="/settings">Settings</a>
      </nav>
      <div class="side-foot">
        <a href="/logout">Sign out</a>
      </div>
    </aside>
    <main class="main">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
